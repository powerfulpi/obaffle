<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access required</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="login">
  <main style="max-width: 480px; margin: 80px auto; padding: 24px;">
    <section class="bot" style="padding: 28px; border-top-color: var(--blue);">
      <div class="title" style="margin-bottom: 18px; display: block;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
          <span class="brand" aria-hidden="true">&gt;_</span>
          <div>
            <p class="eyebrow">OBAMA + WAFFLE</p>
            <h1 style="font-size: 1.5rem; margin: 0;">Access required</h1>
          </div>
        </div>
      </div>

      <form id="login-form" novalidate>
        <label for="password" style="display: block; margin-bottom: 8px; color: var(--muted);">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" placeholder="Enter password" required
          style="width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: #0f1722; color: var(--ink); margin-bottom: 12px;" />

        <div id="login-error" class="error" role="alert" hidden></div>

        <button type="submit" style="width: 100%; margin-top: 8px;">Enter</button>
      </form>
    </section>
  </main>
</body>
</html>
