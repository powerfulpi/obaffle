<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TubeDrop</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e8edf5;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1b2c54 0,transparent 40%),#0b1020}main{max-width:900px;margin:auto;padding:52px 24px}header{display:flex;align-items:center;gap:14px;margin-bottom:42px}.logo{display:grid;place-items:center;background:#ff4b62;color:white;width:48px;height:48px;border-radius:15px;font-size:24px;font-weight:900}h1{font-size:28px;margin:0;letter-spacing:-.04em}header p{margin:3px 0 0;color:#94a3b8}section{background:#141c30;border:1px solid #2c3851;border-radius:20px;padding:28px;margin-bottom:24px;box-shadow:0 20px 50px #0002}h2{font-size:19px;margin:0 0 20px}.download{display:inline-block;background:#ff526b;color:white;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:750;margin-top:14px}.download:hover{background:#ff6e82}.filelinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.filelinks a{font-size:12px;color:#ff9cac}.previous>summary{cursor:pointer;color:#e8edf5;font-size:18px;font-weight:750;list-style:none}.previous>summary::-webkit-details-marker{display:none}.previous>summary:before{content:"▸ ";color:#ff6e82}.previous[open]>summary:before{content:"▾ "}.previous #files{margin-top:16px}label{display:block;font-size:13px;font-weight:700;color:#aebbd0;margin-bottom:8px}input[type=url],select{width:100%;background:#0d1528;border:1px solid #3a4965;border-radius:10px;color:#eef3fa;padding:14px;font:inherit;outline:none}input:focus,select:focus{border-color:#ff6678}input::placeholder{color:#6e7c95}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.check{display:flex;align-items:center;gap:10px;color:#e8edf5;font-size:14px;margin:0 0 22px}.check input{accent-color:#ff526b;width:17px;height:17px}button{border:0;border-radius:10px;background:#ff526b;color:white;padding:13px 21px;font:inherit;font-weight:750;cursor:pointer}button:hover{background:#ff6e82}button:disabled{opacity:.55;cursor:not-allowed}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.path{color:#8fa0b9;font-size:13px;overflow-wrap:anywhere}.job{padding:18px 0;border-top:1px solid #2c3851}.job:first-of-type{border-top:0}.jobtop{display:flex;justify-content:space-between;gap:12px;align-items:start}.url{font-weight:650;overflow-wrap:anywhere}.meta{font-size:13px;color:#9baac1;margin-top:5px}.pill{border-radius:99px;padding:5px 9px;background:#283650;color:#b5c4dc;font-size:12px;white-space:nowrap}.pill.done{background:#143c31;color:#6fe0ad}.pill.error{background:#552332;color:#ff9cad}.pill.running{background:#3e3555;color:#d6b8ff}.bar{height:7px;background:#2a3650;border-radius:9px;margin:15px 0 8px;overflow:hidden}.bar span{display:block;height:100%;background:#ff526b}.current{font-size:12px;color:#9baac1;overflow-wrap:anywhere}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.ghost{background:#2c3851;padding:8px 11px;font-size:12px}.ghost:hover{background:#3b4a67}details{margin-top:10px;color:#9baac1;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;background:#0d1528;padding:12px;border-radius:8px}#message{margin-top:14px;color:#ff9cad;min-height:20px}.empty{color:#9baac1;font-size:14px}footer{color:#8291a9;font-size:12px;line-height:1.5}@media(max-width:600px){main{padding:26px 16px}.row{grid-template-columns:1fr}section{padding:20px}}
</style></head><body><main><header><div class="logo">▶</div><div><h1>TubeDrop</h1><p>Local YouTube downloads, made simple.</p></div></header>
<section><div class="top"><h2>New download</h2><button class="ghost" id="logout" type="button">Sign out</button></div><form id="form"><label for="url">YouTube video or playlist URL</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required><div class="row"><div><label for="format">Format</label><select id="format"><option value="mp3">MP3 audio</option><option value="mp4">MP4 video</option></select></div><div><label for="quality">Quality</label><select id="quality"></select></div></div><label class="check"><input type="checkbox" id="playlist" checked> Download the full playlist when a playlist URL is provided</label><button id="submit" type="submit">Start download</button><div id="message" role="alert"></div></form></section>
<section><div class="top"><h2>Recent jobs</h2><span class="path" id="path"></span></div><div id="jobs" class="empty">No downloads yet.</div></section><section><details class="previous" id="previous"><summary>View previous downloads</summary><div id="files" class="empty">Open to load saved files.</div></details></section><footer>Only download content you have permission to save. The app listens on localhost; your tunnel controls remote access.</footer></main>
<script>
const $=id=>document.getElementById(id), qualities={mp3:[['0','Best VBR'],['192K','192 kbps'],['128K','128 kbps'],['320K','320 kbps']],mp4:[['1080','1080p'],['720','720p'],['480','480p'],['360','360p'],['1440','1440p'],['2160','2160p']]};
function qualityOptions(){const previous=$('quality').value;$('quality').replaceChildren(...qualities[$('format').value].map(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;return o}));if(qualities[$('format').value].some(([v])=>v===previous))$('quality').value=previous}$('format').addEventListener('change',qualityOptions);qualityOptions();
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function refresh(){try{const r=await fetch('/api/jobs');const data=await r.json();$('path').textContent=data.output;$('jobs').replaceChildren();if(!data.ready){$('message').textContent='Install yt-dlp and FFmpeg to start downloading.'}if(!data.jobs.length){$('jobs').textContent='No downloads yet.';return}for(const j of data.jobs){const box=el('div','job'),top=el('div','jobtop'),left=el('div'),title=el('div','url',j.url),meta=el('div','meta',`${j.format.toUpperCase()} · ${j.quality}${j.format==='mp4'?'p':''} · ${j.playlist?'Playlist enabled':'Single video'}`),pill=el('span','pill '+j.status,j.status);left.append(title,meta);top.append(left,pill);box.append(top);if(j.status==='running'){const bar=el('div','bar'),fill=el('span');fill.style.width=j.progress+'%';bar.append(fill);box.append(bar)}if(j.current)box.append(el('div','current',j.current));if(j.status==='done'&&j.files.length){const primary=el('a','download',j.files.length>1?'Download ZIP':'Download file');primary.href=j.files.length>1?'/api/jobs/'+encodeURIComponent(j.id)+'/zip':'/files/'+j.files[0].split('/').map(encodeURIComponent).join('/');box.append(primary);if(j.files.length>1){const links=el('div','filelinks');for(const name of j.files){const link=el('a',null,name.split('/').pop());link.href='/files/'+name.split('/').map(encodeURIComponent).join('/');links.append(link)}box.append(links)}}const actions=el('div','actions');actions.append(el('span','meta',j.progress?`${j.progress.toFixed(1)}% of current item`:''));if(['queued','running'].includes(j.status)){const stop=el('button','ghost','Cancel');stop.onclick=async()=>{await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:j.id})});refresh()};actions.append(stop)}box.append(actions);if(j.log.length){const details=el('details'),summary=el('summary',null,'Show activity log'),pre=el('pre',null,j.log.join('\n'));details.append(summary,pre);box.append(details)}$('jobs').append(box)}}catch(e){$('message').textContent='Cannot reach the local downloader.'}}
async function refreshFiles(){try{const r=await fetch('/api/files'),data=await r.json();$('files').replaceChildren();if(!data.files.length){$('files').textContent='No files yet.';return}for(const file of data.files){const row=el('div','job'),link=el('a','url',file.name);link.href='/files/'+file.name.split('/').map(encodeURIComponent).join('/');link.style.color='#ff8b9b';row.append(link,el('div','meta',`${(file.size/1048576).toFixed(1)} MB`));$('files').append(row)}}catch(e){$('files').textContent='Could not load saved files.'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='';$('submit').disabled=true;try{const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value.trim(),format:$('format').value,quality:$('quality').value,playlist:$('playlist').checked})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not start download');$('url').value='';await refresh()}catch(err){$('message').textContent=err.message}finally{$('submit').disabled=false}});refresh();setInterval(refresh,1200);$('previous').addEventListener('toggle',()=>{if($('previous').open)refreshFiles()});setInterval(()=>{if($('previous').open)refreshFiles()},5000);
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.replace('/')};
</script></body></html>
