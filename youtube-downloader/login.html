<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlock TubeDrop</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f0f3fa;background:#090e1b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#2e3d6a 0,transparent 43%),radial-gradient(circle at 85% 90%,#342544 0,transparent 38%),#090e1b}.shell{width:min(100%,430px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#ff7a7f,#f43f6e);box-shadow:0 10px 30px #f43f6e55;font-size:22px;font-weight:900}.brand span{font-size:23px;font-weight:800;letter-spacing:-.04em}.card{padding:38px;background:#151d31e8;border:1px solid #3a4660;border-radius:24px;box-shadow:0 28px 75px #0007;backdrop-filter:blur(18px)}.icon{width:56px;height:56px;border:1px solid #594258;background:#30263b;color:#ff9cae;border-radius:17px;display:grid;place-items:center;font-size:26px;margin-bottom:24px}h1{font-size:28px;letter-spacing:-.045em;margin:0 0 8px}p{color:#9caac2;line-height:1.5;margin:0 0 28px;font-size:14px}label{display:block;color:#c8d2e2;font-size:13px;font-weight:700;margin-bottom:9px}.field{position:relative}input{width:100%;border:1px solid #485671;border-radius:11px;background:#0d1527;color:#fff;padding:15px 49px 15px 15px;font:inherit;outline:none}input:focus{border-color:#ff6f85;box-shadow:0 0 0 3px #ff6f8525}button{cursor:pointer;font:inherit}#toggle{position:absolute;right:8px;top:8px;background:none;border:0;color:#a9b8cb;padding:8px;font-size:12px}#submit{width:100%;margin-top:18px;border:0;border-radius:11px;background:linear-gradient(135deg,#ff747d,#f6426c);color:white;padding:15px;font-weight:800;box-shadow:0 10px 24px #f6426c30}#submit:hover{filter:brightness(1.1)}#submit:disabled{opacity:.6;cursor:wait}#error{min-height:20px;margin-top:14px;color:#ffa1af;font-size:13px;text-align:center}.foot{text-align:center;color:#75849f;font-size:12px;margin-top:25px}@media(max-width:500px){.card{padding:28px}}
</style></head><body><div class="shell"><div class="brand"><div class="mark">▶</div><span>TubeDrop</span></div><main class="card"><div class="icon">🔒</div><h1>Welcome back</h1><p>Enter your password to access your downloads.</p><form id="form"><label for="password">Password</label><div class="field"><input id="password" type="password" autocomplete="current-password" autofocus required><button id="toggle" type="button" aria-label="Show password">Show</button></div><button id="submit" type="submit">Unlock TubeDrop →</button><div id="error" role="alert"></div></form></main><div class="foot">Your downloads, one private place.</div></div>
<script>
const input=document.getElementById('password');document.getElementById('toggle').onclick=()=>{const visible=input.type==='text';input.type=visible?'password':'text';document.getElementById('toggle').textContent=visible?'Show':'Hide';document.getElementById('toggle').setAttribute('aria-label',visible?'Show password':'Hide password')};
document.getElementById('form').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Could not sign in');location.replace('/')}catch(e){error.textContent=e.message;input.select()}finally{button.disabled=false}};
</script></body></html>
