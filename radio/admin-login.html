<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadiObama admin login</title>
<style>body{font:16px system-ui;background:#12101d;color:white;max-width:480px;margin:12vh auto;padding:20px}h1{color:#ffad51}input,button{font:inherit;padding:12px;border-radius:8px}input{width:100%;box-sizing:border-box;background:#242035;color:white;border:1px solid #574f6b}button{background:#ffad51;border:0;margin-top:14px;cursor:pointer}a{color:#ffad51}</style>
<h1>RadiObama admin</h1><p>Sign in to control playback and test Obama's callouts.</p><form id="form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><p id="error" role="alert"></p><p><a href="/">Back to radio</a></p>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});let j=await r.json();if(r.ok)location.reload();else document.getElementById('error').textContent=j.error||'Could not sign in'}</script></html>
